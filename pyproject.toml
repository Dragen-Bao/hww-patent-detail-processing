[project]
name = "hww-patent-detail-processing"
version = "0.1.0"
description = "Patent-detail preprocessing, IPC metrics, and Chinese patent text quality measurement"
requires-python = ">=3.11"
dependencies = [
  "jieba>=0.42.1",
  "matplotlib>=3.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18.0",
  "scikit-learn>=1.5",
  "scipy>=1.14"
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "subprojects"]
